[package]
name = "actiontui"
version = "0.1.3"
edition = "2024"
description = "A Ratatui terminal dashboard for watching GitHub Actions workflow runs"
license = "Apache-2.0"
repository = "https://github.com/jfarcand/actiontui"
authors = ["jfarcand"]
readme = "README.md"
keywords = ["github", "actions", "ci", "tui", "ratatui"]
categories = ["command-line-utilities"]

[dependencies]
chrono = { version = "0.4.45", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
crossterm = { version = "0.29.0", features = ["event-stream"] }
dirs = "6.0.0"
futures = "0.3.32"
ratatui = "0.30.1"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "default-tls", "http2", "charset"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["full"] }
toml = "1.1.2"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_precision_loss = "allow"
cast_possible_wrap = "allow"
missing_const_for_fn = "allow"
struct_excessive_bools = "allow"
too_many_lines = "allow"
significant_drop_tightening = "allow"
